name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and extras
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev,noise,kernel,singlecell,datasets]"

      - name: Run full test suite
        run: |
          set -o pipefail
          mkdir -p test-output
          PYTHONPATH=src pytest tests/ -v --tb=long -W error \
            --junitxml=test-output/junit-${{ matrix.python-version }}.xml \
            2>&1 | tee test-output/pytest-${{ matrix.python-version }}.txt

      - name: Regenerate figures and paper tables
        run: |
          PYTHONPATH=src python scripts/generate_all_figures.py
          PYTHONPATH=src python scripts/verify_publication_bundle.py

      - name: Headless notebook smoke test (Python 3.11 only)
        if: matrix.python-version == '3.11'
        run: PYTHONPATH=src python scripts/run_notebooks_headless.py

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output-py${{ matrix.python-version }}
          path: test-output/

      - name: Upload figures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: figures-py${{ matrix.python-version }}
          path: results/figures/
