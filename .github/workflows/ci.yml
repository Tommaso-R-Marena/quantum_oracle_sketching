name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Two-step install (base + extras)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Step 1: package + dev extras
          pip install -e ".[dev]"
          # Step 2: noise + kernel extras (kept separate so a single-extra
          # dependency resolver error does not mask the base install)
          pip install -e ".[dev,noise,kernel]"

      - name: Run full test suite
        run: |
          mkdir -p test-output
          PYTHONPATH=src pytest tests/ -v --tb=short \
            --junitxml=test-output/junit-${{ matrix.python-version }}.xml \
            2>&1 | tee test-output/pytest-${{ matrix.python-version }}.txt

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output-py${{ matrix.python-version }}
          path: test-output/
